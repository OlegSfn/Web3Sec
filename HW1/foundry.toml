[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

[profile.default.fuzz]
runs = 256
seed = "0x7472697066756e64"

[fmt]
line_length = 110
